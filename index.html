<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>MocchiStream</title>
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="description" content="Películas y series en streaming, sin cuentas y sin complicaciones." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/fonts-material.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <img id="logoImg" src="icons/profile.png" alt="MocchiStream" class="logo" onerror="this.style.display='none'" />
    <span class="brand-tag">MocchiStream</span>
    <img id="avatarImg" src="" alt="Avatar" class="avatar" ondblclick="openAdminModal()" onerror="this.style.display='none'" />
  </header>

  <main class="app-main">

    <section id="view-selections" class="app-view">
      <h2 class="search-view-head" id="selectionsTitle">Selecciones</h2>
      <p class="card-hint" id="selectionsHint">Tus películas curadas, siempre a la mano.</p>
      <div class="cat-back-row hidden" id="catBackRow">
        <button class="cat-back" onclick="backToCats()" aria-label="Volver">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h2 class="search-view-head" id="catHead" style="margin:0;"></h2>
      </div>
      <div id="catTiles" class="cat-tiles"></div>
      <div id="catGrid" class="video-grid hidden" style="margin-top:1rem;"></div>
    </section>

    <section id="view-explore" class="app-view hidden">
      <div id="homeSections"></div>
    </section>

    <section id="view-search" class="app-view hidden">
      <div class="search-panel">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" class="input-glass" placeholder="Buscar películas o series..." autocomplete="nope" data-lpignore="true" spellcheck="false" />
        <div class="search-chips" id="searchChips"></div>
      </div>
      <h2 class="search-view-head" id="searchHead">Resultados</h2>
      <div id="searchGrid"></div>
      <div id="searchStatus" class="status-msg hidden"></div>
    </section>

    <section id="view-library" class="app-view hidden">
      <h2 class="search-view-head">Mi lista</h2>
      <div class="lib-tabs">
        <button class="lib-tab active" data-tab="favs" id="libTabFavs">Favoritos</button>
        <button class="lib-tab" data-tab="wl" id="libTabWL">Ver después</button>
        <button class="lib-tab" data-tab="hist" id="libTabHist">Historial</button>
      </div>
      <div id="libGrid" class="video-grid"></div>
    </section>

    <section id="view-profile" class="app-view hidden">
      <div class="profile-card">
        <img id="profileAvatar" class="profile-avatar" src="" alt="Avatar" ondblclick="openAdminModal()" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%231a1a2e%22/%3E%3Ctext x=%2250%25%22 y=%2255%25%22 fill=%22%23666%22 font-size=%2238%22 text-anchor=%22middle%22%3E?%3C/text%3E%3C/svg%3E'" />
        <h2 class="profile-name">Mi perfil</h2>
        <p class="profile-sub">MocchiStream</p>
        <button id="installBtn" class="btn btn-neon w-full hidden" style="margin-top:1rem;">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:1.1rem;height:1.1rem;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v10m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
          Instalar app
        </button>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    © 2026 · Hecho por Kael~
  </footer>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-view="selections" aria-label="Selecciones">
      <span class="nav-ico"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10.5 12 3l9 7.5M5 9.5V21h5v-6h4v6h5V9.5"/></svg></span>
      <span>Selecciones</span>
    </button>
    <button class="nav-item" data-view="explore" aria-label="Explorar">
      <span class="nav-ico"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span>
      <span>Explorar</span>
    </button>
    <button class="nav-item" data-view="search" aria-label="Buscar">
      <span class="nav-ico"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></span>
      <span>Buscar</span>
    </button>
    <button class="nav-item" data-view="library" aria-label="Mi lista">
      <span class="nav-ico"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.5 3h15v18l-7.5-4.5L4.5 21z"/></svg></span>
      <span>Mi lista</span>
    </button>
    <button class="nav-item" data-view="profile" aria-label="Perfil">
      <span class="nav-ico"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></span>
      <span>Perfil</span>
    </button>
  </nav>

  <div id="detailView" class="detail-view hidden">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <div class="detail-topbar">
      <button class="detail-round" onclick="closeDetail()" aria-label="Volver">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button class="detail-round" id="detailFavBtn" aria-label="Favorito"></button>
      <button class="detail-round" id="detailWLBtn" aria-label="Ver después">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h14a1 1 0 011 1v15l-8-4.5L4 20V5a1 1 0 011-1z"/></svg>
      </button>
      <button class="detail-round" id="detailShareBtn" aria-label="Compartir">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M12 3v13m0-13 4 4m-4-4-4 4"/></svg>
      </button>
    </div>
    <div class="detail-inner">
      <h1 class="detail-title" id="detailTitle"></h1>
      <div class="detail-badges" id="detailBadges"></div>
      <p class="detail-desc" id="detailDesc"></p>
      <div class="detail-actions">
        <button class="btn-play" id="detailPlayBtn">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Reproducir
        </button>
        <button class="btn-dl" id="detailDownloadBtn" onclick="detailDownload()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v10m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
          Descargar
        </button>
      </div>
      <h3 class="detail-seasons-title" id="detailSeasonsTitle"></h3>
      <div id="detailSeasons"></div>
    </div>
  </div>

  <div id="sourceSheet" class="sheet-wrap hidden">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="sheetTitle">Seleccionar fuente</h3>
      <p class="sheet-sub" id="sheetSub"></p>
      <div id="sheetList" class="sheet-list"></div>
    </div>
  </div>

  <div id="fullPlayer" class="fullscreen-player hidden">
    <div class="player-header">
      <button onclick="closeFullPlayer()" class="player-close" aria-label="Cerrar">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="player-info">
        <h2 id="playerTitle"></h2>
        <p id="playerCategory"></p>
      </div>
    </div>
    <div class="player-stage" id="playerStage">
      <video id="playerVideoBox" class="player-video" playsinline webkit-playsinline></video>
      <div class="video-overlay" id="playerOverlay">
        <button class="overlay-play" id="overlayPlayBtn" aria-label="Reproducir">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <div class="player-controls" id="playerControls">
        <input type="range" class="ctrl-seek" id="ctrlSeek" min="0" max="1000" value="0" aria-label="Progreso" />
        <div class="ctrl-row">
          <button class="ctrl-btn" id="ctrlBack" aria-label="Retroceder 10s">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5a7 7 0 1 1-6.6 9.5M4 4v5h5"/></svg>
          </button>
          <button class="ctrl-btn" id="ctrlPlay" aria-label="Reproducir/Pausar">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="ctrlFwd" aria-label="Adelantar 10s">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5a7 7 0 1 0 6.6 9.5M20 4v5h-5"/></svg>
          </button>
          <button class="ctrl-btn hidden" id="ctrlDownload" aria-label="Descargar video">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v10m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
          </button>
          <span class="ctrl-time" id="ctrlTime">0:00</span>
          <button class="ctrl-btn" id="ctrlSettings" aria-label="Ajustes del reproductor">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>
          </button>
          <button class="ctrl-btn" id="ctrlFull" aria-label="Pantalla completa">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>
      <div class="player-buffering hidden" id="playerBuffering"><span class="spinner"></span></div>
      <div class="ended-box hidden" id="endedBox">
        <p class="ended-title">Terminaste este título</p>
        <div class="ended-actions">
          <button class="btn btn-neon" id="endedReplayBtn">Volver a ver</button>
          <button class="btn btn-ghost hidden" id="endedNextBtn">Siguiente capítulo</button>
        </div>
      </div>
      <div class="settings-panel hidden" id="settingsPanel">
        <div class="settings-handle"></div>
        <div class="settings-section" id="settingsQualitySection">
          <h3 class="settings-section-title">Calidad</h3>
          <div class="settings-list" id="settingsQualityList"></div>
        </div>
        <div class="settings-section">
          <h3 class="settings-section-title">Velocidad</h3>
          <div class="settings-list" id="settingsSpeedList"></div>
        </div>
        <div class="settings-section hidden" id="settingsAudioSection">
          <h3 class="settings-section-title">Audio</h3>
          <div class="settings-list" id="settingsAudioList"></div>
        </div>
        <div class="settings-section hidden" id="settingsSubSection">
          <h3 class="settings-section-title">Subtítulos</h3>
          <div class="settings-list" id="settingsSubList"></div>
        </div>
      </div>
    </div>
    <div class="player-iframe-container hidden" id="playerIframeBox">
      <iframe id="playerIframe" class="player-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
  </div>

  <div id="adminLoginModal" class="modal-overlay hidden">
    <div class="modal-card modal-card-center">
      <h2 class="modal-title" style="justify-content:center;">Acceso privado</h2>
      <input type="password" id="adminPasswordInput" placeholder="Contraseña" class="input-glass w-full" autocomplete="new-password" data-lpignore="true" />
      <button onclick="loginAdmin()" class="btn btn-neon w-full">Continuar</button>
      <p id="loginError" class="error-msg hidden">Contraseña incorrecta</p>
    </div>
  </div>

  <div id="ptrIndicator" class="ptr-indicator hidden"><span class="ptr-arrow">↓</span></div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/StreamSaver.js"></script>
  <script src="js/hls.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
