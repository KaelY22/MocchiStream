<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Detalle — MocchiStream</title>
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="description" content="Detalle de película o serie en MocchiStream." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
  <script>try{var t=localStorage.getItem('ms_theme')==='light';document.documentElement.setAttribute('data-theme',t?'light':'dark');document.querySelector('meta[name="color-scheme"]').setAttribute('content',t?'light':'dark')}catch(e){}</script>
</head>
<body>

  <header class="site-header">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a href="/" class="logo-link"><img src="icons/profile.png" alt="MocchiStream" class="logo" /></a>
    <div class="search-box">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="search" id="searchInput" class="input-glass" placeholder="Buscar..." autocomplete="off" spellcheck="false" />
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema"></button>
  </header>

  <main class="app-main">
    <div id="detailView" class="detail-view">
      <div class="detail-backdrop" id="detailBackdrop"></div>
      <div class="detail-topbar">
        <button class="detail-round" onclick="closeDetail()" aria-label="Volver">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="detail-topbar-right">
          <button class="detail-round" id="detailFavBtn" aria-label="Favorito"></button>
          <button class="detail-round" id="detailWLBtn" aria-label="Ver después">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h14a1 1 0 011 1v15l-8-4.5L4 20V5a1 1 0 011-1z"/></svg>
          </button>
          <button class="detail-round" id="detailShareBtn" aria-label="Compartir">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M12 3v13m0-13 4 4m-4-4-4 4"/></svg>
          </button>
        </div>
      </div>
      <div class="detail-inner">
        <h1 class="detail-title" id="detailTitle"></h1>
        <div class="detail-badges" id="detailBadges"></div>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="detail-actions">
          <button class="btn-play" id="detailPlayBtn">
            <span class="btn-play-ico"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>Reproducir
          </button>
          <button class="btn-dl hidden" id="detailDlBtn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 4v12m0 0 4-4m-4 4-4-4"/></svg>Descargar
          </button>
        </div>
        <h3 class="detail-seasons-title" id="detailSeasonsTitle"></h3>
        <div id="detailSeasons"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    © 2026 · Hecho por Kael~
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app-detail.js"></script>
</body>
</html>
