<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Favoritos — MocchiStream</title>
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="description" content="Tus favoritos en MocchiStream." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
  <script>try{var t=localStorage.getItem('ms_theme')==='light';document.documentElement.setAttribute('data-theme',t?'light':'dark');document.querySelector('meta[name="color-scheme"]').setAttribute('content',t?'light':'dark')}catch(e){}</script>
</head>
<body>

  <header class="site-header">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a href="/" class="logo-link"><img src="icons/profile.png" alt="MocchiStream" class="logo" /></a>
    <div class="search-box">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="search" id="searchInput" class="input-glass" placeholder="Buscar..." autocomplete="off" spellcheck="false" />
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema"></button>
  </header>

  <main class="app-main">
    <section id="view-lib" class="app-view" data-kind="favs">
      <h2 class="search-view-head">Favoritos</h2>
      <div id="libGrid"></div>
    </section>
  </main>

  <footer class="site-footer">
    © 2026 · Hecho por Kael~
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app-lib.js"></script>
</body>
</html>
