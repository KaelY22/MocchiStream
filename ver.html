<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Reproduciendo — MocchiStream</title>
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="description" content="Reproductor de MocchiStream." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
  <script>try{var t=localStorage.getItem('ms_theme')==='light';document.documentElement.setAttribute('data-theme',t?'light':'dark');document.querySelector('meta[name="color-scheme"]').setAttribute('content',t?'light':'dark')}catch(e){}</script>
</head>
<body>

  <header class="site-header">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a href="/" class="logo-link"><img src="icons/profile.png" alt="MocchiStream" class="logo" /></a>
    <div class="search-box">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="search" id="searchInput" class="input-glass" placeholder="Buscar..." autocomplete="off" spellcheck="false" />
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Cambiar tema"></button>
  </header>

  <main class="app-main"></main>

  <footer class="site-footer">
    © 2026 · Hecho por Kael~
  </footer>

  <div id="fullPlayer" class="fullscreen-player hidden">
    <div class="player-header">
      <button onclick="closeFullPlayer()" class="player-close" aria-label="Cerrar">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="player-info">
        <h2 id="playerTitle"></h2>
        <p id="playerCategory"></p>
      </div>
    </div>
    <div class="player-stage" id="playerStage">
      <div class="player-loading hidden" id="playerLoading">
        <span class="spinner"></span>
        <p>Cargando la mejor fuente sin anuncios...</p>
      </div>
      <video id="playerVideoBox" class="player-video" playsinline webkit-playsinline></video>
      <div class="video-overlay" id="playerOverlay">
        <button class="overlay-play" id="overlayPlayBtn" aria-label="Reproducir">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <div class="player-controls" id="playerControls">
        <input type="range" class="ctrl-seek" id="ctrlSeek" min="0" max="1000" value="0" aria-label="Progreso" />
        <div class="ctrl-row">
          <button class="ctrl-btn" id="ctrlBack" aria-label="Retroceder 10s">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5a7 7 0 1 1-6.6 9.5M4 4v5h5"/></svg>
          </button>
          <button class="ctrl-btn" id="ctrlPlay" aria-label="Reproducir/Pausar">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="ctrlFwd" aria-label="Adelantar 10s">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5a7 7 0 1 0 6.6 9.5M20 4v5h-5"/></svg>
          </button>
          <button class="ctrl-btn hidden" id="ctrlDownload" aria-label="Descargar video">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v10m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
          </button>
          <span class="ctrl-time" id="ctrlTime">0:00</span>
          <button class="ctrl-btn" id="ctrlSettings" aria-label="Ajustes del reproductor">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>
          </button>
          <button class="ctrl-btn" id="ctrlFull" aria-label="Pantalla completa">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>
      <div class="player-buffering hidden" id="playerBuffering"><span class="spinner"></span></div>
      <div class="ended-box hidden" id="endedBox">
        <p class="ended-title">Terminaste este título</p>
        <div class="ended-actions">
          <button class="btn btn-neon" id="endedReplayBtn">Volver a ver</button>
          <button class="btn btn-ghost hidden" id="endedNextBtn">Siguiente capítulo</button>
        </div>
      </div>
      <div class="settings-panel hidden" id="settingsPanel">
        <div class="settings-handle"></div>
        <div class="settings-section" id="settingsQualitySection">
          <h3 class="settings-section-title">Calidad</h3>
          <div class="settings-list" id="settingsQualityList"></div>
        </div>
        <div class="settings-section">
          <h3 class="settings-section-title">Velocidad</h3>
          <div class="settings-list" id="settingsSpeedList"></div>
        </div>
        <div class="settings-section hidden" id="settingsAudioSection">
          <h3 class="settings-section-title">Audio</h3>
          <div class="settings-list" id="settingsAudioList"></div>
        </div>
        <div class="settings-section hidden" id="settingsSubSection">
          <h3 class="settings-section-title">Subtítulos</h3>
          <div class="settings-list" id="settingsSubList"></div>
        </div>
      </div>
    </div>
    <div class="player-iframe-container hidden" id="playerIframeBox">
      <iframe id="playerIframe" class="player-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/StreamSaver.js"></script>
  <script src="js/hls.min.js"></script>
  <script type="module" src="js/app-ver.js"></script>
</body>
</html>
