<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f0f1a" />
  <title>MocchiStream · Gestión</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-page">

    <header class="site-header admin-header">
      <img src="icons/profile.png" alt="MocchiStream" class="logo" onerror="this.style.display='none'" />
      <span class="brand-tag">Gestión</span>
      <button onclick="logout()" class="btn btn-ghost btn-small">Salir</button>
    </header>

    <div id="loginScreen" class="login-screen">
      <div class="login-card">
        <h2 class="login-title">Acceso privado</h2>
        <input type="password" id="loginPassword" placeholder="Contraseña" class="input-glass w-full" autocomplete="new-password" />
        <button onclick="adminLoginCheck()" class="btn btn-neon w-full">Ingresar</button>
        <p id="loginErrorMsg" class="error-msg hidden">Contraseña incorrecta</p>
      </div>
    </div>

    <div id="adminContent" class="admin-content hidden animate-fade-in-up">

      <!-- ============ PANEL ============ -->
      <section id="view-panel" class="admin-view app-view">
        <div class="admin-glass-card">
          <h3 class="card-title">
            <svg class="t-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h5v5H4zM15 4h5v5h-5zM4 15h5v5H4zM15 15h5v5h-5z"/></svg>
            Caché del worker
          </h3>
          <p class="card-hint">La caché acelera la app pero guarda resultados viejos hasta 5 min (búsquedas y portada). Púrjala si quieres ver cambios al instante.</p>
          <div id="cacheBox">
            <div class="cache-row"><span class="spinner"></span></div>
          </div>
        </div>

        <div class="admin-glass-card">
          <h3 class="card-title">
            <svg class="t-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            Accesos rápidos
          </h3>
          <div class="btn-row">
            <a class="btn btn-ghost" href="https://mocchi-stream.pages.dev" target="_blank" rel="noopener">Abrir la app</a>
          </div>
        </div>
      </section>

      <!-- ============ PERFIL ============ -->
      <section id="view-profile" class="admin-view app-view hidden">
        <div class="admin-glass-card">
          <h3 class="card-title">
            <svg class="t-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Avatar
          </h3>
          <div class="avatar-row">
            <img id="adminAvatarPreview" class="avatar-preview" src="" alt="Avatar" />
            <div class="avatar-controls">
              <input type="text" id="avatarUrlInput" placeholder="URL del avatar" class="input-glass w-full" autocomplete="off" />
              <div class="btn-row">
                <button onclick="saveAvatar()" class="btn btn-neon btn-small">Guardar avatar</button>
                <button onclick="deleteAvatar()" class="btn btn-danger btn-small">Eliminar</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <nav class="bottom-nav hidden" id="adminNav">
      <button class="nav-item active" data-view="panel" aria-label="Panel">
        <span class="nav-ico"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span>
        <span>Panel</span>
      </button>
      <button class="nav-item" data-view="profile" aria-label="Perfil">
        <span class="nav-ico"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></span>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
